volumes:
  mongo:
  images:

services:
  web:
    build:
      context: .
      dockerfile: prod.Dockerfile
    depends_on:
      - mongo
      - redis
    environment:
      - NODE_ENV=${NODE_ENV}
      - SITE=${SITE}
      - GOOGLE_ID=${GOOGLE_ID}
      - GOOGLE_SECRET=${GOOGLE_SECRET}
      - MONGODB_URI=${MONGODB_URI}
    env_file:
      - .env
    ports:
      - '4733:3000'
    restart: unless-stopped
  mongo:
    image: mongo:7.0
    ports:
      - '27017:27017'
    volumes:
      - mongo:/data/db
  imaginary:
    image: h2non/imaginary:1.2.4
    volumes:
      - images:/mnt/data
    environment:
      PORT: 9000
    command: -enable-url-source -mount /mnt/data -allowed-origins ${IMAGINARY_ALLOWED_ORIGINS} -http-cache-ttl 31556926
    ports:
      - '9000:9000'
  redis:
    image: redis:8.4
    ports:
      - '6379:6379'
